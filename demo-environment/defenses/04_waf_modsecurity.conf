# =====================================================================
# DEFENSE #4 — Web Application Firewall (ModSecurity)
# =====================================================================
# Goal: detect and block malicious requests at the web-server layer,
#       before they reach the application code (virtual patching).
#
# Effectiveness: ~85%   Performance: +15ms   Complexity: high
#
# INSTALL (Apache on Debian/Ubuntu):
#   sudo apt install libapache2-mod-security2 -y
#   sudo a2enmod security2
#   sudo cp /etc/modsecurity/modsecurity.conf-recommended \
#           /etc/modsecurity/modsecurity.conf
#   # then set:  SecRuleEngine On
#   # include this file from your Apache config and restart:
#   sudo systemctl restart apache2
# =====================================================================

# Turn the engine on (use DetectionOnly first to tune, then On)
SecRuleEngine On

# Log blocked requests for analysis
SecAuditEngine RelevantOnly
SecAuditLog /var/log/apache2/modsec_audit.log

# ---------------------------------------------------------------------
# Custom rules targeting XSS / session hijacking
# ---------------------------------------------------------------------

# Block <script> tags in any argument
SecRule ARGS "@rx <\s*script" \
    "id:1000,phase:2,deny,status:403,log,msg:'XSS: <script> tag detected'"

# Block inline event handlers and javascript: URIs
SecRule ARGS "@rx (?i)(on\w+\s*=|javascript\s*:|<\s*(iframe|object|embed|svg))" \
    "id:1001,phase:2,deny,status:403,log,msg:'XSS: handler or dangerous tag'"

# Block attempts to read document.cookie
SecRule ARGS "@rx (?i)document\s*\.\s*cookie" \
    "id:1002,phase:2,deny,status:403,log,msg:'Session hijack: document.cookie'"

# Block common obfuscation helpers
SecRule ARGS "@rx (?i)\b(eval|atob|btoa|fromCharCode)\s*\(" \
    "id:1003,phase:2,deny,status:403,log,msg:'Suspicious JS function'"

# Simple per-IP rate limit (max 100 requests / collection window)
SecAction "id:1004,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule IP:REQUEST_COUNT "@gt 100" \
    "id:1005,phase:1,deny,status:429,log,msg:'Rate limit exceeded',\
     setvar:ip.request_count=+1"

# ---------------------------------------------------------------------
# RECOMMENDED: also enable the OWASP Core Rule Set (CRS)
#   sudo apt install modsecurity-crs
#   Include /usr/share/modsecurity-crs/owasp-crs.load
# ---------------------------------------------------------------------

# TEST:
#   curl "http://localhost/secure-app/?comment=<script>alert(1)</script>"
#   -> HTTP/1.1 403 Forbidden  (ModSecurity: XSS: <script> tag detected)
